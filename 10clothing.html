<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing</title>
    <link rel="stylesheet" href="11stylecategory.css">
</head>
<body>
    <script src="13script.js"></script>
    <h1 style="text-align:center;">Clothing</h1>

<div class="product-grid">

    <div class="product-card">
        <img src="https://images.pexels.com/photos/298863/pexels-photo-298863.jpeg">
        <h3>T-Shirt</h3>
        <p>₹699</p>
        <button onclick="addToCart('T-shirt', 699)">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://images.pexels.com/photos/1124465/pexels-photo-1124465.jpeg">
        <h3>Jeans</h3>
        <p>₹1499</p>
        <button onclick="addToCart('Jeans', 1499)">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://images.pexels.com/photos/1488467/pexels-photo-1488467.jpeg">
        <h3>Hoodie</h3>
        <p>₹1299</p>
        <button onclick="addToCart('Hoodie', 1299)">Add to Cart</button>
    </div>

</div>
</body>
</html>
