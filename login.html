<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="2style.css">

    <style>

        body {

            background: #f4f4f4;
        }

        .login-container {

            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .login-container h1 {

            text-align: center;
            margin-bottom: 20px;
        }

        .login-container input {

            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        .login-container button {

            width: 100%;
            padding: 12px;
            background: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>
<body>

<div class="login-container">

    <h1>Login</h1>

    <form id="login-form">
         <input type="text"
           id="username"
           placeholder="Enter Username"
           required>

        <input type="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

<script src="13script.js"></script>

</body>
</html>
